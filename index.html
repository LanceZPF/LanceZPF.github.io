<body>

  <!-- Random Walk background canvas -->

  <!-- Cursor trail canvas -->

  <section id="hero">
    <div id="dice-container"></div>
    <div id="hero-text">
      <h1>Pengfei Zhou</h1>
      <p class="tagline">PhD @ NUS. Everything is random.</p>
      <nav class="links">
        <a href="mailto:zpf4wp@outlook.com">[email]</a>
        <a href="./files/about/CV_Lance_PengfeiZHOU.pdf" target="_blank">[cv]</a>

    <h2 class="section-label">research := {</h2>

    <p class="shuffle-note">// papers are randomly ordered. refresh for a different perspective.</p>

  </section>

  <!-- ==================== LIFE RANDOM WALK ==================== -->
  <section id="life-walk">
    <h2 class="section-label">life_as_random_walk()</h2>
    <div id="life-svg-container"></div>
  </section>

  <!-- ==================== QUOTE ==================== -->
  <section id="quote-section">
    <blockquote id="random-quote"></blockquote>
  </section>

  <!-- ==================== FOOTER ==================== -->
  <footer>
    <button id="reroll-btn">[ re-roll ]</button>
    <p class="footer-note">seed = <span id="seed-val"></span></p>
  </footer>

  <script src="app.js"></script>

</html>
